# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hyprland.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

autogenerated = 0 # remove this line to remove the warning

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,preferred,auto,auto


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun -config ~/.config/rofi/config.rasi


#################
### AUTOSTART ###
#################

# Autostart optimisé pour développeur web mobile
exec-once = waybar &
exec-once = hyprpaper
exec-once = dunst
exec-once = nm-applet &
exec-once = /usr/lib/kdeconnectd &
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = swayidle -w timeout 600 'hyprlock' timeout 900 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on'

# Applications de démarrage avec assignation explicite
exec-once = [workspace 1 silent] code
exec-once = [workspace 2 silent] brave --restore-last-session
exec-once = [workspace 4 silent] kitty
exec-once = [workspace 6 silent] obsidian
exec-once = [workspace 7 silent] drawio --reopen-last-tabs
exec-once = [workspace 8 silent] discord

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

# Curseur et thème
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Variables pour développement web
env = EDITOR,code
env = BROWSER,brave
env = TERMINAL,kitty

# Optimisations Wayland
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = CLUTTER_BACKEND,wayland

# Développement Node.js/Web
env = NODE_OPTIONS,--max-old-space-size=4096
env = CHROME_EXECUTABLE,/usr/bin/brave


###################
### PERMISSIONS ###
###################

# See https://wiki.hyprland.org/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 4
    gaps_out = 8

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(74c7ecee) rgba(89b4faee) 45deg # Catppuccin blue
    col.inactive_border = rgba(45475aaa) # Catppuccin surface1

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 5
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, slidefade #10%
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]
windowrule = float,class:^dolphin$

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
    force_split = 2 # Force split to right and buttom
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = fr
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    numlock_by_default = true

    touchpad {
        natural_scroll = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace_swipe = false
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Raccourcis ergonomiques optimisés pour clavier compact
# Applications principales (touches facilement accessibles)
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Space, exec, rofi -show drun -config ~/.config/rofi/config.rasi # Menu avec Space
bind = $mainMod, A, exec, brave --new-window # A = Applications web
bind = $mainMod SHIFT, A, exec, firefox --new-window # Firefox alternatif
bind = $mainMod, S, exec, code --new-window # S = Source code
bind = $mainMod SHIFT, S, exec, code ~/.config # Config editing
bind = $mainMod, D, exec, dolphin # D = Directory/Dossiers
bind = $mainMod, F, fullscreenstate, 3 # F = Fullscreen

# Workflow développement (touches QWERTY gauches)
bind = $mainMod, Q, killactive # Q = Quit
bind = $mainMod, W, exec, kitty --class "floating-terminal" # W = Window terminal
bind = $mainMod SHIFT, W, workspace, 4 # Aller au terminal workspace
bind = $mainMod, E, exec, brave --app=https://github.com # E = dEvelop (GitHub)
bind = $mainMod SHIFT, E, exec, kitty --hold -e lazygit # Git interface
bind = $mainMod, R, exec, hyprctl reload # R = Reload
bind = $mainMod, T, togglefloating # T = Toggle floating

# Actions fréquentes (touches centrales accessibles)
bind = $mainMod, G, exec, hyprpicker -a -f hex # G = Get color
bind = $mainMod SHIFT, G, exec, hyprshot -m region # Screenshot
bind = $mainMod, semicolon, togglesplit # ; = split
bind = $mainMod, comma, workspace, -1 # , = workspace précédent
bind = $mainMod, period, workspace, +1 # . = workspace suivant

# Outils spécialisés (touches droites)
bind = $mainMod, Z, exec, docker-desktop # Z = containerZone
bind = $mainMod, X, exec, brave --app=https://www.figma.com # X = eXperience design
bind = $mainMod, C, exec, hyprpicker -a # C = Color picker simple
bind = $mainMod, V, pseudo # V = Virtual tiling
bind = $mainMod, B, exec, brave # B = Browser principal
bind = $mainMod, N, exec, obsidian # N = Notes
bind = $mainMod, M, exit # M = eXit (quit Hyprland)
bind = $mainMod, slash, exec, hyprlock # / = lock

# Navigation workspaces ergonomique
bind = $mainMod, TAB, workspace, previous # Tab = workspace précédent
bind = $mainMod SHIFT, TAB, workspace, +1 # Shift+Tab = workspace suivant
bind = $mainMod, Page_Up, workspace, -1 # Page précédente
bind = $mainMod, Page_Down, workspace, +1 # Page suivante

# Workspaces avec touches numériques (standard)
bind = $mainMod, ampersand, workspace, 1 # & = 1 (clavier FR)
bind = $mainMod, eacute, workspace, 2 # é = 2
bind = $mainMod, quotedbl, workspace, 3 # " = 3
bind = $mainMod, apostrophe, workspace, 4 # ' = 4
bind = $mainMod, parenleft, workspace, 5 # ( = 5
bind = $mainMod, section, workspace, 6 # § = 6
bind = $mainMod, egrave, workspace, 7 # è = 7
bind = $mainMod, exclam, workspace, 8 # ! = 8
bind = $mainMod, ccedilla, workspace, 9 # ç = 9

# Déplacement fenêtres vers workspaces (avec Shift)
bind = $mainMod SHIFT, ampersand, movetoworkspace, 1
bind = $mainMod SHIFT, eacute, movetoworkspace, 2
bind = $mainMod SHIFT, quotedbl, movetoworkspace, 3
bind = $mainMod SHIFT, apostrophe, movetoworkspace, 4
bind = $mainMod SHIFT, parenleft, movetoworkspace, 5
bind = $mainMod SHIFT, section, movetoworkspace, 6
bind = $mainMod SHIFT, egrave, movetoworkspace, 7
bind = $mainMod SHIFT, exclam, movetoworkspace, 8
bind = $mainMod SHIFT, ccedilla, movetoworkspace, 9

# Déplacement silencieux (avec Alt)
bind = $mainMod ALT, ampersand, movetoworkspacesilent, 1
bind = $mainMod ALT, eacute, movetoworkspacesilent, 2
bind = $mainMod ALT, quotedbl, movetoworkspacesilent, 3
bind = $mainMod ALT, apostrophe, movetoworkspacesilent, 4

# Workspaces spéciaux (touches facilement accessibles)
bind = $mainMod, U, togglespecialworkspace, dev-tools # U = Utilities
bind = $mainMod SHIFT, U, movetoworkspace, special:dev-tools
bind = $mainMod, Y, togglespecialworkspace, notes # Y = Year/notes
bind = $mainMod SHIFT, Y, movetoworkspace, special:notes
bind = $mainMod, I, togglespecialworkspace, magic # I = Invisible/magic
bind = $mainMod SHIFT, I, movetoworkspace, special:magic

# Gestion des fenêtres optimisée (touches HJKL comme Vim)
bind = $mainMod, H, movefocus, l # H = Left (gauche)
bind = $mainMod, J, movefocus, d # J = Down (bas) - overrides togglesplit
bind = $mainMod, K, movefocus, u # K = Up (haut) - overrides workspace +1
bind = $mainMod, L, movefocus, r # L = Right (droite) - overrides lock

# Déplacement des fenêtres (Shift + HJKL)
bind = $mainMod SHIFT, H, movewindoworgroup, l
bind = $mainMod SHIFT, J, movewindoworgroup, d  
bind = $mainMod SHIFT, L, movewindoworgroup, r
bind = $mainMod SHIFT, K, movewindoworgroup, u

# Redimensionnement des fenêtres (Ctrl + HJKL)
bind = $mainMod CTRL, H, resizeactive, -40 0
bind = $mainMod CTRL, L, resizeactive, 40 0
bind = $mainMod CTRL, K, resizeactive, 0 -40
bind = $mainMod CTRL, J, resizeactive, 0 40

# Actions alternatives (puisque certaines touches sont réassignées)
bind = $mainMod, semicolon, togglesplit # ; = split (remplace J)
bind = $mainMod, comma, workspace, -1 # , = workspace précédent
bind = $mainMod, period, workspace, +1 # . = workspace suivant  
bind = $mainMod, slash, exec, hyprlock # / = lock (remplace L)

# Flèches comme alternative (pour compatibilité)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindoworgroup, l
bind = $mainMod SHIFT, right, movewindoworgroup, r
bind = $mainMod SHIFT, down, movewindoworgroup, d
bind = $mainMod SHIFT, up, movewindoworgroup, u

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, code:10, workspace, 1
bind = $mainMod, code:11, workspace, 2
bind = $mainMod, code:12, workspace, 3
bind = $mainMod, code:13, workspace, 4
bind = $mainMod, code:14, workspace, 5
bind = $mainMod, code:15, workspace, 6
bind = $mainMod, code:16, workspace, 7
bind = $mainMod, code:17, workspace, 8
bind = $mainMod, code:18, workspace, 9
bind = $mainMod, code:19, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, code:10, movetoworkspace, 1
bind = $mainMod SHIFT, code:11, movetoworkspace, 2
bind = $mainMod SHIFT, code:12, movetoworkspace, 3
bind = $mainMod SHIFT, code:13, movetoworkspace, 4
bind = $mainMod SHIFT, code:14, movetoworkspace, 5
bind = $mainMod SHIFT, code:15, movetoworkspace, 6
bind = $mainMod SHIFT, code:16, movetoworkspace, 7
bind = $mainMod SHIFT, code:17, movetoworkspace, 8
bind = $mainMod SHIFT, code:18, movetoworkspace, 9
bind = $mainMod SHIFT, code:19, movetoworkspace, 10

# Example special workspace (scratchpad) - supprimé car en conflit avec S = Source code

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Screenshots et capture optimisés
bind = , Print, exec, hyprshot -m region # Print = capture région
bind = $mainMod, Print, exec, hyprshot -m window # Super+Print = fenêtre
bind = $mainMod SHIFT, Print, exec, hyprshot -m output # Super+Shift+Print = écran complet

# Gestion du volume et luminosité (sans touches fonction)
bind = $mainMod, equal, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ # = pour +
bind = $mainMod, minus, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- # - pour -
bind = $mainMod SHIFT, equal, exec, brightnessctl set 5%+ # Shift+= pour luminosité +
bind = $mainMod SHIFT, minus, exec, brightnessctl set 5%- # Shift+- pour luminosité -


##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# Règles de fenêtres optimisées pour développement web mobile
windowrule = float, class:^floating-terminal$
windowrule = size 800 600, class:^floating-terminal$
windowrule = center, class:^floating-terminal$
windowrule = float, class:^(pavucontrol|nm-connection-editor)$
windowrule = float, class:^(hyprpicker|Color Picker)$
windowrule = pin, class:^(hyprpicker|Color Picker)$
windowrule = float, class:^dolphin$
windowrule = size 900 700, class:^dolphin$
windowrule = float, title:^(DevTools|Developer Tools)$
windowrule = size 1200 800, title:^(DevTools|Developer Tools)$
windowrule = workspace 3 silent, title:^(DevTools|Developer Tools)$

# Règles pour applications spécifiques
windowrule = tile, class:^(code|Code)$
windowrule = tile, class:^(firefox|brave-browser)$
windowrule = float, class:^(discord|Discord)$, title:^(Discord Updater)$
windowrule = workspace 8 silent, class:^(discord|Discord)$, title:^(Discord Updater)$

# Auto-assignment des applications aux workspaces (workflow dev web mobile)
windowrule = workspace 1 silent, class:^(code|Code)$
windowrule = workspace 1 silent, class:^(jetbrains-.*)$
windowrule = workspace 2 silent, class:^(firefox|Firefox)$
windowrule = workspace 2 silent, class:^(google-chrome|Google-chrome)$
# Règles Brave finales - Ordre critique
# D'abord les règles les plus spécifiques (Keep et YouTube)
windowrule = workspace 5 silent, title:keep.google.com
windowrule = workspace 9 silent, title:youtube.com
windowrule = workspace 5 silent, title:Keep
windowrule = workspace 9 silent, title:YouTube
# Pas de règle générale - chaque instance doit être assignée manuellement

# Autres applications
windowrule = workspace 3 silent, class:^(responsively|Responsively)$
windowrule = workspace 4 silent, class:^(kitty|Alacritty)$
windowrule = workspace 5 silent, class:^(docker-desktop|Docker Desktop)$
windowrule = workspace 5 silent, class:^(postman|Postman|insomnia|Insomnia)$
windowrule = workspace 6 silent, class:^(obsidian|Obsidian)$
windowrule = workspace 7 silent, class:^(figma|Figma|drawio|Draw.io|app.diagrams.net)$
windowrule = workspace 8 silent, class:^(discord|Discord|slack|Slack|teams|Teams)$
windowrule = workspace 9 silent, class:^(spotify|Spotify|vlc|VLC)$

# Gestion intelligente des workspaces pour développement
workspace = 1, monitor:auto, default:true, persistent:true # Dev principal
workspace = 2, monitor:auto, persistent:true # Navigateurs
workspace = 3, monitor:auto, persistent:true # Mobile/Responsive
workspace = 4, monitor:auto, persistent:true # Terminal
workspace = 5, monitor:auto, persistent:true # DevOps
workspace = special:dev-tools, gapsout:20, gapsin:10 # DevTools
workspace = special:notes, gapsout:20, gapsin:10 # Notes/docs

# Configuration multi-moniteur (si applicable)
# workspace = 1, monitor:DP-1
# workspace = 2, monitor:HDMI-A-1
