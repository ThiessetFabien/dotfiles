# #######################################################################################
# HYPRLAND CONFIGURATION - OPTIMISÉE POUR DÉVELOPPEMENT
# Dernière mise à jour : 10 février 2026
# Version Hyprland : v0.53.3
# #######################################################################################
#
# Configuration optimisée pour :
#   - Développement web mobile (VS Code, navigateurs, terminaux)
#   - Workflow multi-moniteur (1600x900 + 1920x1080)
#   - Performances maximales (blur réduit, animations rapides, VFR/VRR)
#   - Économie d'énergie (Variable Frame Rate, DPMS intelligent)
#   - Ergonomie clavier FR (raccourcis optimisés, navigation Vim-style)
#
# Optimisations appliquées :
#   ✓ Blur : 2 passes (au lieu de 3) → gain ~20% performance
#   ✓ Opacity : 0.92 pour fenêtres inactives → meilleure lisibilité code
#   ✓ Animations workspace : vitesse 4 (au lieu de 7) → navigation rapide
#   ✓ VFR/VRR activés → économie batterie et fluidité
#   ✓ Window swallowing pour terminaux (Kitty, Alacritty)
#   ✓ Focus intelligent et auto-activation
#
# Documentation complète : https://wiki.hyprland.org/Configuring/
# Fichiers associés : hyprlock.conf, monitor-setup.sh, waybar, rofi
#
# #######################################################################################

autogenerated = 0


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
# Configuration multi-moniteur optimisée
# Écran principal (PC) - 1600x900 à gauche
monitor = eDP-1, 1600x900@60, 0x0, 1
# Second écran (externe) - 1920x1080 à droite
monitor = HDMI-A-1, 1920x1080@60, 1600x0, 1
# Fallback pour configuration automatique
monitor = , preferred, auto, auto


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = dolphin
$menu = rofi -show run


#################
### AUTOSTART ###
#################

# Autostart optimisé pour développeur web mobile
exec-once = waybar &
exec-once = hyprpaper
exec-once = dunst
exec-once = nm-applet &
exec-once = /usr/lib/kdeconnectd &
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = swayidle -w timeout 600 'hyprlock' timeout 900 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on'

# Configuration multi-moniteur automatique
exec-once = sleep 2 && ~/.config/hypr/monitor-setup.sh

# ┌─────────────────────────────────────────────────────────────────────────┐
# │ APPLICATIONS AU DÉMARRAGE                                               │
# ├─────────────────────────────────────────────────────────────────────────┤
# │ WS 1 (eDP-1)     : Brave (onglets restaurés) + Obsidian               │
# │ WS 2 (HDMI-A-1)  : Antigravity IDE                                     │
# │ WS 3 (HDMI-A-1)  : Terminaux (kitty général + kitty btop)              │
# └─────────────────────────────────────────────────────────────────────────┘

# Workspace 1 — Navigation & Notes (écran laptop)
exec-once = [workspace 1 silent] brave --restore-last-session
exec-once = sleep 2 && hyprctl dispatch exec "[workspace 1 silent] obsidian"

# Workspace 2 — Développement (écran externe)
exec-once = sleep 3 && hyprctl dispatch exec "[workspace 2 silent] antigravity"

# Workspace 3 — Terminaux (écran externe)
exec-once = sleep 1 && hyprctl dispatch exec "[workspace 3 silent] kitty"
exec-once = sleep 1 && hyprctl dispatch exec "[workspace 3 silent] kitty"

# Scratchpad
exec-once = sleep 4 && hyprctl dispatch exec "[workspace special:scratchpad silent] kitty"

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/
#
# Variables configurées pour environnement de développement web :
#   - Éditeur par défaut : VS Code
#   - Navigateur : Brave
#   - Terminal : Kitty
#   - Node.js : 4GB heap max pour projets volumineux
#   - Wayland natif pour toutes les applications GTK/Qt/Mozilla

# Curseur et thème
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Variables pour développement web
env = EDITOR,code
env = BROWSER,brave
env = TERMINAL,kitty

# Optimisations Wayland
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = CLUTTER_BACKEND,wayland

# Développement Node.js/Web
env = NODE_OPTIONS,--max-old-space-size=4096
env = CHROME_EXECUTABLE,/usr/bin/brave

###################
### PERMISSIONS ###
###################

# See https://wiki.hyprland.org/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 4
    gaps_out = 5
    gaps_workspaces = 50

    border_size = 1

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(74c7ecee) rgba(89b4faee) 45deg # Catppuccin blue
    col.inactive_border = rgba(45475aaa) # Catppuccin surface1

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true
    no_focus_fallback = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = true

    #layout = dwindle

    snap {
        enabled = true
        window_gap = 4
        monitor_gap = 5
        respect_gaps = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
# OPTIMISATIONS APPLIQUÉES :
#   - inactive_opacity = 0.92 (au lieu de 0.85) → meilleure lisibilité du code
#   - blur passes = 2 (au lieu de 3) → gain ~20% performance sans perte visuelle
decoration {
    rounding = 12
    rounding_power = 2.0

    active_opacity = 1.0
    inactive_opacity = 0.95 # Augmenté pour lisibilité max

    shadow {
        enabled = false # Désactivé pour performance LLM
    }

    blur {
        enabled = false # Désactivé pour performance LLM
    }

    # Dim
    dim_inactive = true
    dim_strength = 0.05
    dim_special = 0.07
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
# OPTIMISATION : vitesse workspace = 4 (au lieu de 7) pour navigation plus rapide
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 3, myBezier
    animation = windowsOut, 1, 3, default, popin 80%
    animation = border, 1, 5, default
    animation = borderangle, 1, 4, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 3, default
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    # pseudotile = true # [DÉPRÉCIÉ] Géré via le dispatcher 'pseudo' (Super+V)
    preserve_split = true # You probably want this
    force_split = 2 # Force split to right and buttom
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ OPTIMISATIONS DÉVELOPPEMENT                                             │
# ├─────────────────────────────────────────────────────────────────────────┤
# │ VFR (Variable Frame Rate)    → Économie batterie importante            │
# │ VRR (Variable Refresh Rate)  → Fluidité adaptative                     │
# │ DPMS intelligent             → Activation écran au mouvement/clavier   │
# │ Auto-reload config           → Rechargement automatique modifications  │
# │ Focus on activate            → Focus auto sur nouvelles fenêtres       │
# │ Window swallowing            → Terminaux avalent sous-processus GUI    │
# └─────────────────────────────────────────────────────────────────────────┘
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
    
    # Optimisations développement
    vrr = 1 # Variable Refresh Rate - meilleur pour gaming/animations
    mouse_move_enables_dpms = true # Réveille écran au mouvement souris
    key_press_enables_dpms = true # Réveille écran au clavier
    disable_autoreload = false # Auto-reload config lors des changements
    focus_on_activate = true # Focus automatique sur fenêtres activées
    enable_swallow = true # Swallow terminal windows (ranger, etc)
    swallow_regex = ^(kitty|Alacritty|antigravity)$
}

debug {
    vfr = true # Variable Frame Rate - déplacé ici dans la v0.55+
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = fr
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    numlock_by_default = true

    touchpad {
        natural_scroll = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
#gestures {
#    workspace_swipe = false
#}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# ┌─────────────────────────────────────────────────────────────────────────┐
# │ RACCOURCIS ESSENTIELS - Clavier FR optimisé                            │
# ├─────────────────────────────────────────────────────────────────────────┤
# │ APPLICATIONS PRINCIPALES                                                │
# │   Super + Return    → Terminal (Kitty)                                 │
# │   Super + Space     → Menu applications (Rofi)                         │
# │   Super + S         → VS Code (nouveau projet)                         │
# │   Super + A         → Brave (nouveau navigateur)                       │
# │   Super + D         → Dolphin (gestionnaire fichiers)                  │
# │                                                                         │
# │ NAVIGATION FENÊTRES (VIM-STYLE)                                        │
# │   Super + H/J/K/L   → Focus gauche/bas/haut/droite                    │
# │   Super + Shift + H/J/K/L → Déplacer fenêtre                          │
# │   Super + Ctrl + H/J/K/L  → Redimensionner fenêtre                    │
# │                                                                         │
# │ WORKSPACES                                                              │
# │   Super + &é"' ...  → Aller au workspace 1-4 (touches FR)             │
# │   Super + Tab       → Workspace précédent                              │
# │   Super + ,/.       → Workspace -1/+1                                  │
# │   Super + Shift + & → Déplacer vers workspace 1                       │
# │                                                                         │
# │ ACTIONS RAPIDES                                                         │
# │   Super + Q         → Fermer fenêtre active                            │
# │   Super + F         → Plein écran                                      │
# │   Super + T         → Toggle floating                                  │
# │   Super + /         → Verrouiller (hyprlock)                           │
# │   Print             → Screenshot région                                │
# │                                                                         │
# │ MULTI-MONITEUR                                                          │
# │   Super + Shift + O/P → Déplacer fenêtre vers autre écran            │
# │   Super + Ctrl + B    → Recharger Waybar                             │
# │   Super + Shift + Ret → Scratchpad Terminal                          │
# └─────────────────────────────────────────────────────────────────────────┘

# Raccourcis ergonomiques optimisés pour clavier compact
# Applications principales (touches facilement accessibles)
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Space, exec, rofi -show drun -config ~/.config/rofi/config.rasi # Menu avec Space
bind = $mainMod, A, exec, brave --new-window # A = Applications web
bind = $mainMod, S, exec, antigravity # S = Source code (Antigravity)
bind = $mainMod SHIFT, S, exec, antigravity ~/.config # Config editing
bind = $mainMod, D, exec, dolphin # D = Directory/Dossiers
bind = $mainMod, F, fullscreenstate, 3 # F = Fullscreen

# Workflow développement (touches QWERTY gauches)
bind = $mainMod, Q, killactive # Q = Quit
bind = $mainMod, W, exec, kitty # W = Window terminal
bind = $mainMod SHIFT, W, workspace, 4 # Aller au terminal workspace
bind = $mainMod, E, exec, brave --app=https://github.com # E = dEvelop (GitHub)
bind = $mainMod SHIFT, E, exec, kitty --hold -e lazygit # Git interface
bind = $mainMod, T, togglefloating # T = Toggle floating

# Actions fréquentes (touches centrales accessibles)
bind = $mainMod, G, exec, hyprpicker -a -f hex # G = Get color
bind = $mainMod SHIFT, G, exec, hyprshot -m region # Screenshot
bind = $mainMod, semicolon, layoutmsg, togglesplit # ; = split
bind = $mainMod, comma, workspace, -1 # , = workspace précédent
bind = $mainMod, period, workspace, +1 # . = workspace suivant

# Outils spécialisés (touches droites)
bind = $mainMod, Z, exec, docker-desktop # Z = containerZone
bind = $mainMod, X, exec, brave --app=https://www.figma.com # X = eXperience design
bind = $mainMod, C, exec, hyprpicker -a # C = Color picker simple
bind = $mainMod, V, pseudo # V = Virtual tiling
bind = $mainMod, B, exec, brave # B = Browser principal
bind = $mainMod, N, exec, obsidian # N = Notes
bind = $mainMod, M, exit # M = eXit (quit Hyprland)
bind = $mainMod, slash, exec, hyprlock # / = lock

# Navigation workspaces ergonomique
bind = $mainMod, TAB, workspace, previous # Tab = workspace précédent
bind = $mainMod SHIFT, TAB, workspace, +1 # Shift+Tab = workspace suivant
bind = $mainMod, Page_Up, workspace, -1 # Page précédente
bind = $mainMod, Page_Down, workspace, +1 # Page suivante

# Workspaces avec touches numériques (standard)
bind = $mainMod, ampersand, workspace, 1 # & = 1 (clavier FR)
bind = $mainMod, eacute, workspace, 2 # é = 2
bind = $mainMod, quotedbl, workspace, 3 # " = 3
bind = $mainMod, apostrophe, workspace, 4 # ' = 4
bind = $mainMod, parenleft, workspace, 5 # ( = 5
bind = $mainMod, section, workspace, 6 # § = 6
bind = $mainMod, egrave, workspace, 7 # è = 7
bind = $mainMod, exclam, workspace, 8 # ! = 8
bind = $mainMod, ccedilla, workspace, 9 # ç = 9

# Déplacement fenêtres vers workspaces (avec Shift)
bind = $mainMod SHIFT, ampersand, movetoworkspace, 1
bind = $mainMod SHIFT, eacute, movetoworkspace, 2
bind = $mainMod SHIFT, quotedbl, movetoworkspace, 3
bind = $mainMod SHIFT, apostrophe, movetoworkspace, 4
bind = $mainMod SHIFT, parenleft, movetoworkspace, 5
bind = $mainMod SHIFT, section, movetoworkspace, 6
bind = $mainMod SHIFT, egrave, movetoworkspace, 7
bind = $mainMod SHIFT, exclam, movetoworkspace, 8
bind = $mainMod SHIFT, ccedilla, movetoworkspace, 9

# Déplacement silencieux (avec Alt)
bind = $mainMod ALT, ampersand, movetoworkspacesilent, 1
bind = $mainMod ALT, eacute, movetoworkspacesilent, 2
bind = $mainMod ALT, quotedbl, movetoworkspacesilent, 3
bind = $mainMod ALT, apostrophe, movetoworkspacesilent, 4

# Workspaces spéciaux (touches facilement accessibles)
bind = $mainMod, U, togglespecialworkspace, dev-tools # U = Utilities
bind = $mainMod SHIFT, U, movetoworkspace, special:dev-tools
bind = $mainMod, Y, togglespecialworkspace, notes # Y = Year/notes
bind = $mainMod SHIFT, Y, movetoworkspace, special:notes
bind = $mainMod, I, togglespecialworkspace, magic # I = Invisible/magic
bind = $mainMod SHIFT, I, movetoworkspace, special:magic
bind = $mainMod SHIFT, Return, togglespecialworkspace, scratchpad # Scratchpad terminal
bind = $mainMod ALT, Return, movetoworkspace, special:scratchpad

# Gestion des fenêtres optimisée (touches HJKL comme Vim)
bind = $mainMod, H, movefocus, l # H = Left (gauche)
bind = $mainMod, J, movefocus, d # J = Down (bas) - overrides togglesplit
bind = $mainMod, K, movefocus, u # K = Up (haut) - overrides workspace +1
bind = $mainMod, L, movefocus, r # L = Right (droite) - overrides lock

# Déplacement des fenêtres (Shift + HJKL)
bind = $mainMod SHIFT, H, movewindoworgroup, l
bind = $mainMod SHIFT, J, movewindoworgroup, d  
bind = $mainMod SHIFT, L, movewindoworgroup, r
bind = $mainMod SHIFT, K, movewindoworgroup, u

# Redimensionnement des fenêtres (Ctrl + HJKL)
bind = $mainMod CTRL, H, resizeactive, -40 0
bind = $mainMod CTRL, L, resizeactive, 40 0
bind = $mainMod CTRL, K, resizeactive, 0 -40
bind = $mainMod CTRL, J, resizeactive, 0 40

# Actions alternatives (puisque certaines touches sont réassignées)
bind = $mainMod, semicolon, layoutmsg, togglesplit # ; = split (remplace J)
bind = $mainMod, comma, workspace, -1 # , = workspace précédent
bind = $mainMod, period, workspace, +1 # . = workspace suivant  
bind = $mainMod, slash, exec, hyprlock # / = lock (remplace L)

# Flèches comme alternative (pour compatibilité)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindoworgroup, l
bind = $mainMod SHIFT, right, movewindoworgroup, r
bind = $mainMod SHIFT, down, movewindoworgroup, d
bind = $mainMod SHIFT, up, movewindoworgroup, u

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, code:10, workspace, 1
bind = $mainMod, code:11, workspace, 2
bind = $mainMod, code:12, workspace, 3
bind = $mainMod, code:13, workspace, 4
bind = $mainMod, code:14, workspace, 5
bind = $mainMod, code:15, workspace, 6
bind = $mainMod, code:16, workspace, 7
bind = $mainMod, code:17, workspace, 8
bind = $mainMod, code:18, workspace, 9
bind = $mainMod, code:19, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, code:10, movetoworkspace, 1
bind = $mainMod SHIFT, code:11, movetoworkspace, 2
bind = $mainMod SHIFT, code:12, movetoworkspace, 3
bind = $mainMod SHIFT, code:13, movetoworkspace, 4
bind = $mainMod SHIFT, code:14, movetoworkspace, 5
bind = $mainMod SHIFT, code:15, movetoworkspace, 6
bind = $mainMod SHIFT, code:16, movetoworkspace, 7
bind = $mainMod SHIFT, code:17, movetoworkspace, 8
bind = $mainMod SHIFT, code:18, movetoworkspace, 9
bind = $mainMod SHIFT, code:19, movetoworkspace, 10

# Example special workspace (scratchpad) - supprimé car en conflit avec S = Source code

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Screenshots et capture optimisés
bind = , Print, exec, hyprshot -m region # Print = capture région
bind = $mainMod, Print, exec, hyprshot -m window # Super+Print = fenêtre
bind = $mainMod SHIFT, Print, exec, hyprshot -m output # Super+Shift+Print = écran complet

# Gestion du volume et luminosité (sans touches fonction)
bind = $mainMod, equal, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ # = pour +
bind = $mainMod, minus, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- # - pour -
bind = $mainMod SHIFT, equal, exec, brightnessctl set 5%+ # Shift+= pour luminosité +
bind = $mainMod SHIFT, minus, exec, brightnessctl set 5%- # Shift+- pour luminosité -

# Raccourcis pour gestion multi-moniteur
bind = $mainMod SHIFT, O, movewindow, mon:+1  # Déplacer fenêtre vers moniteur suivant
bind = $mainMod SHIFT, P, movewindow, mon:-1  # Déplacer fenêtre vers moniteur précédent
bind = $mainMod CTRL, O, moveworkspacetomonitor, +0, +1  # Workspace vers moniteur suivant
bind = $mainMod CTRL, P, moveworkspacetomonitor, +0, -1  # Workspace vers moniteur précédent
bind = $mainMod CTRL, M, movecurrentworkspacetomonitor, +1  # Toggle workspace entre écrans
bind = $mainMod CTRL, B, exec, killall waybar; waybar & # Reload waybar


##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# ┌─────────────────────────────────────────────────────────────────────────┐
# │ ORGANISATION DES WORKSPACES                                             │
# ├─────────────────────────────────────────────────────────────────────────┤
# │ WS 1 (eDP-1    1600x900)  : Brave + Obsidian                          │
# │ WS 2 (HDMI-A-1 1920x1080) : Antigravity IDE                           │
# │ WS 3 (HDMI-A-1 1920x1080) : Terminaux (kitty)                         │
# │                                                                         │
# │ WORKSPACES SPÉCIAUX (toggle avec Super+U/Y/I)                         │
# │   dev-tools : Outils de développement temporaires                      │
# │   notes     : Notes rapides et scratchpad                              │
# └─────────────────────────────────────────────────────────────────────────┘

# Assignation stricte des workspaces aux moniteurs
workspace = 1, monitor:eDP-1, default:true          # Brave + Obsidian
workspace = 2, monitor:HDMI-A-1, default:true        # Antigravity IDE
workspace = 3, monitor:HDMI-A-1                      # Terminaux

# Workspaces spéciaux
workspace = special:dev-tools, gapsout:20, gapsin:10 # DevTools
workspace = special:notes, gapsout:20, gapsin:10 # Notes/docs

# ─── Règles fenêtres par application ───────────────────────────────────────
# Force TOUTES les fenêtres Antigravity (y compris projets restaurés) sur WS 2
windowrule = workspace 2 silent, match:class ^(antigravity)$

# #######################################################################################
# FIN DE CONFIGURATION
# #######################################################################################
#
# COMMANDES UTILES :
#   hyprctl reload                    → Recharger la configuration
#   hyprctl clients                   → Liste des fenêtres ouvertes
#   hyprctl monitors                  → Informations moniteurs
#   hyprctl workspaces                → Liste des workspaces actifs
#   hyprctl version                   → Version Hyprland
#
# FICHIERS ASSOCIÉS :
#   ~/.config/hypr/hyprlock.conf      → Configuration verrouillage
#   ~/.config/hypr/monitor-setup.sh   → Script configuration multi-moniteur
#   ~/.config/waybar/                 → Configuration barre de tâches
#   ~/.config/rofi/                   → Configuration menu applications
#   ~/.config/kitty/                  → Configuration terminal
#
# DÉPANNAGE :
#   - Blur trop lent ? Réduire 'passes' à 1 dans decoration.blur
