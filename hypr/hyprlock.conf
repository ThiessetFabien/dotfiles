general {
    # Utilisation du module PAM pour l'authentification sécurisée
    pam_module = hyprlock

    # Cache le curseur sur l'écran de verrouillage
    hide_cursor = true

    # Rendu immédiat pour réduire les artefacts visuels
    immediate_render = true

    # Mise à l'échelle fractionnaire pour écrans HiDPI
    fractional_scaling = 1

    # Désactive la barre de chargement
    disable_loading_bar = true

    # Délai réduit après un échec d'authentification
    #fail_timeout = 500

    # Délai de grâce réduit pour une réactivité immédiate
    grace = 0

    # Ignore la touche vide pour éviter les déverrouillages accidentels
    ignore_empty_input = false

    # Texte à afficher lorsque la session est verrouillée depuis un certain temps
    text_trim = true
    
    # Optimisations pour réduire la latence
    no_fade_in = true
    no_fade_out = true
}

background {
    # Gradient simulé avec une couleur de base sombre
    color = rgba(8, 12, 25, 1.0)
    
    # Mode de remplissage
    mode = fill
    
    # Effet de flou pour la profondeur
    blur_passes = 4
    blur_size = 12
}

# Couche de gradient supérieure (simulation)
background {
    # Couleur plus claire pour créer l'effet gradient
    color = rgba(15, 20, 35, 0.7)
    
    # Mode de remplissage
    mode = center
}

input-field {
    # Affiche le champ de saisie sur le moniteur principal
    monitor = eDP-1

    # Positionnement dans le dernier tiers en bas de l'écran
    position = 0, -220

    # Dimensions plus généreuses pour la saisie
    size = 450, 80

    # Couleurs optimisées pour la lisibilité
    outline_thickness = 3
    outline_color = rgba(137, 180, 250, 0.8)
    inner_color = rgba(30, 30, 46, 0.98)
    font_color = rgba(205, 214, 244, 1.0)
    font_family = JetBrains Mono
    font_size = 18

    # Apparence des points de mot de passe améliorée
    dots_size = 0.3
    dots_spacing = 0.7
    dots_center = true

    # Messages d'interface en français avec style tech
    fail_text = "❌ Erreur : Identifiants invalides | Réessaye..."
    fail_color = rgba(243, 139, 168, 1.0)
    
    # Placeholder en français avec style dev
    placeholder_text = "🔐 Tape ton mot de passe magique..."
    
    # Animation de fade réduite pour plus de réactivité
    fade_on_empty = false
    fade_timeout = 0

    # Coins arrondis plus prononcés
    rounding = 20

    # Ombre plus subtile et élégante
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.3)
    shadow_boost = 1.2
}



# Heure centrale - Point focal
label {
    monitor = eDP-1
    text = cmd[update:1000] echo "🕐 $(date +"%H:%M:%S")"
    font_size = 72
    font_color = rgba(137, 180, 250, 1.0)
    font_family = JetBrains Mono Bold
    position = 0, 160
    halign = center
    valign = center
}

